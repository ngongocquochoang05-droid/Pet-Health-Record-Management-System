<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyPuppy | Đăng Nhập</title>
  <meta name="description" content="Đăng nhập MyPuppy để đặt lịch chăm sóc thú cưng, truy cập giao diện nhân viên hoặc quản trị.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/frontend-ui.css">
</head>
<body class="auth-page text-slate-900">
  <main class="flex min-h-screen flex-col items-center justify-center px-4 py-10">
    <a href="../index.html" class="auth-brand hero-fade mb-9" aria-label="MyPuppy Premium">
      <span class="auth-brand__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <circle cx="7.2" cy="7.1" r="2.05"></circle>
          <circle cx="12" cy="5.7" r="1.9"></circle>
          <circle cx="16.7" cy="7.4" r="2.05"></circle>
          <circle cx="18.1" cy="12.2" r="1.8"></circle>
          <path d="M12.1 19.7c-1.2 0-2.1-.44-2.86-1.06-.54-.43-.97-.7-1.63-.7-1.46 0-2.63-1.14-2.63-2.7 0-2.9 2.5-5.62 5.54-5.62 3.85 0 7.12 3.08 7.12 6.2 0 2.22-1.64 3.9-3.88 3.9-.84 0-1.38-.24-1.97-.62-.23-.15-.44-.25-.69-.25Z"></path>
        </svg>
      </span>
      <span class="auth-brand__word"><span>My</span>Puppy</span>
    </a>

    <section class="auth-card auth-card--custom hero-fade-delay w-full max-w-lg rounded-[1.4rem] border border-sky-100 bg-white/95 px-8 py-10 shadow-[0_28px_90px_rgba(15,23,42,0.10)] md:px-10">
      <div class="text-center">
        <h1 class="text-3xl font-extrabold text-slate-950">Đăng nhập</h1>
        <p class="mt-3 flex items-center justify-center gap-2 text-base text-slate-500">
          <span>Chào mừng bạn quay lại!</span>
          <svg class="h-4 w-4 text-sky-500" viewBox="0 0 24 24" fill="currentColor">
            <circle cx="7.2" cy="7.1" r="2.05"></circle>
            <circle cx="12" cy="5.7" r="1.9"></circle>
            <circle cx="16.7" cy="7.4" r="2.05"></circle>
            <circle cx="18.1" cy="12.2" r="1.8"></circle>
            <path d="M12.1 19.7c-1.2 0-2.1-.44-2.86-1.06-.54-.43-.97-.7-1.63-.7-1.46 0-2.63-1.14-2.63-2.7 0-2.9 2.5-5.62 5.54-5.62 3.85 0 7.12 3.08 7.12 6.2 0 2.22-1.64 3.9-3.88 3.9-.84 0-1.38-.24-1.97-.62-.23-.15-.44-.25-.69-.25Z"></path>
          </svg>
        </p>
      </div>

      <form id="login-form" class="mt-9 space-y-5">
        <label class="block">
          <span class="text-base font-semibold text-slate-800">Email</span>
          <span class="auth-input mt-3">
            <svg class="h-5 w-5 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M4 6.5h16v11H4z"></path>
              <path d="m4.8 7.2 7.2 5.4 7.2-5.4"></path>
            </svg>
            <input id="login-email" type="email" autocomplete="email" placeholder="email@example.com" class="w-full bg-transparent text-base text-slate-900 outline-none placeholder:text-slate-400">
          </span>
        </label>

        <label class="block">
          <span class="text-base font-semibold text-slate-800">Mật khẩu</span>
          <span class="auth-input mt-3">
            <svg class="h-5 w-5 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="5" y="10" width="14" height="10" rx="2"></rect>
              <path d="M8 10V7.5a4 4 0 0 1 8 0V10"></path>
            </svg>
            <input id="login-password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" class="w-full bg-transparent text-base text-slate-900 outline-none placeholder:text-slate-400">
            <button id="toggle-password" type="button" class="rounded-full p-1 text-slate-400 transition hover:bg-slate-100 hover:text-sky-600" aria-label="Hiện mật khẩu">
              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M2.5 12s3.3-6 9.5-6 9.5 6 9.5 6-3.3 6-9.5 6-9.5-6-9.5-6Z"></path>
                <circle cx="12" cy="12" r="2.6"></circle>
              </svg>
            </button>
          </span>
        </label>

        <p id="login-error" class="hidden rounded-2xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm font-semibold text-rose-700">
          Thông tin đăng nhập chưa đúng. Vui lòng thử lại.
        </p>

        <button id="login-submit" type="submit" class="auth-submit">
          Đăng nhập
        </button>
      </form>

      <div class="auth-divider">
        <span></span>
        <p>hoặc</p>
        <span></span>
      </div>

      <button id="google-login" type="button" class="auth-social-button">
        <svg class="h-5 w-5" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M21.6 12.23c0-.78-.07-1.53-.2-2.23H12v4.22h5.38a4.6 4.6 0 0 1-1.99 3.02v2.5h3.22c1.88-1.73 2.99-4.28 2.99-7.51Z"></path>
          <path fill="#34A853" d="M12 22c2.7 0 4.96-.9 6.61-2.26l-3.22-2.5c-.9.6-2.03.95-3.39.95-2.6 0-4.8-1.75-5.59-4.11H3.08v2.59A10 10 0 0 0 12 22Z"></path>
          <path fill="#FBBC05" d="M6.41 14.08A6.03 6.03 0 0 1 6.09 12c0-.72.12-1.42.32-2.08V7.33H3.08A10 10 0 0 0 2 12c0 1.61.39 3.13 1.08 4.47l3.33-2.39Z"></path>
          <path fill="#EA4335" d="M12 5.81c1.46 0 2.78.5 3.82 1.49l2.86-2.86C16.95 2.83 14.7 2 12 2a10 10 0 0 0-8.92 5.33l3.33 2.59C7.2 7.56 9.4 5.81 12 5.81Z"></path>
        </svg>
        <span>Đăng nhập bằng Google</span>
      </button>

      <div class="mt-7 text-center">
        <p class="text-base text-slate-500">
          Chưa có tài khoản?
          <a href="dang-ky.html" class="font-bold text-sky-600 transition hover:text-sky-700">Đăng ký miễn phí</a>
        </p>
        <a href="../index.html" class="mt-5 inline-flex text-sm font-medium text-slate-400 transition hover:text-sky-600">Quay lại Trang chủ</a>
      </div>
    </section>
  </main>

  <script src="../../shared/auth/clerk-config.js"></script>
  <script src="../assets/js/login.js"></script>
</body>
</html>
