<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyPuppy | Đăng Nhập</title>
  <meta name="description" content="Đăng nhập MyPuppy để đặt lịch chăm sóc thú cưng, truy cập giao diện nhân viên hoặc quản trị demo.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/frontend-ui.css">
</head>
<body class="auth-page text-slate-900">
  <main class="flex min-h-screen flex-col items-center justify-center px-4 py-10">
    <a href="../index.html" class="auth-brand hero-fade mb-9" aria-label="MyPuppy Premium">
      <span class="auth-brand__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <circle cx="7.2" cy="7.1" r="2.05"></circle>
          <circle cx="12" cy="5.7" r="1.9"></circle>
          <circle cx="16.7" cy="7.4" r="2.05"></circle>
          <circle cx="18.1" cy="12.2" r="1.8"></circle>
          <path d="M12.1 19.7c-1.2 0-2.1-.44-2.86-1.06-.54-.43-.97-.7-1.63-.7-1.46 0-2.63-1.14-2.63-2.7 0-2.9 2.5-5.62 5.54-5.62 3.85 0 7.12 3.08 7.12 6.2 0 2.22-1.64 3.9-3.88 3.9-.84 0-1.38-.24-1.97-.62-.23-.15-.44-.25-.69-.25Z"></path>
        </svg>
      </span>
      <span class="auth-brand__word"><span>My</span>Puppy</span>
    </a>

    <section class="auth-card hero-fade-delay w-full max-w-xl rounded-[1.4rem] border border-sky-100 bg-white/95 px-8 py-10 shadow-[0_28px_90px_rgba(15,23,42,0.10)] md:px-10">
      <div class="text-center">
        <h1 class="text-3xl font-extrabold text-slate-950">Đăng nhập</h1>
        <p class="mt-3 flex items-center justify-center gap-2 text-base text-slate-500">
          <span>Chào mừng bạn quay lại!</span>
          <svg class="h-4 w-4 text-sky-500" viewBox="0 0 24 24" fill="currentColor">
            <circle cx="7.2" cy="7.1" r="2.05"></circle>
            <circle cx="12" cy="5.7" r="1.9"></circle>
            <circle cx="16.7" cy="7.4" r="2.05"></circle>
            <circle cx="18.1" cy="12.2" r="1.8"></circle>
            <path d="M12.1 19.7c-1.2 0-2.1-.44-2.86-1.06-.54-.43-.97-.7-1.63-.7-1.46 0-2.63-1.14-2.63-2.7 0-2.9 2.5-5.62 5.54-5.62 3.85 0 7.12 3.08 7.12 6.2 0 2.22-1.64 3.9-3.88 3.9-.84 0-1.38-.24-1.97-.62-.23-.15-.44-.25-.69-.25Z"></path>
          </svg>
        </p>
      </div>

      <div class="mt-9">
        <p class="text-sm font-semibold uppercase tracking-[0.18em] text-slate-500">Đăng nhập nhanh demo</p>
        <div class="mt-3 grid gap-3">
          <button id="admin-demo" type="button" class="auth-demo auth-demo--admin">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M12 3l7 4v5c0 4.5-2.8 7.6-7 9-4.2-1.4-7-4.5-7-9V7l7-4Z"></path>
            </svg>
            <span>Admin - admin@mypuppy.vn</span>
          </button>
          <button id="staff-demo" type="button" class="auth-demo auth-demo--staff">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M4 20h16"></path>
              <path d="M8 20V8h8v12"></path>
              <path d="M7 8l5-4 5 4"></path>
            </svg>
            <span>Nhân viên Mai - staff@mypuppy.vn</span>
          </button>
          <button id="customer-demo" type="button" class="auth-demo auth-demo--customer">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor">
              <circle cx="7.2" cy="7.1" r="2.05"></circle>
              <circle cx="12" cy="5.7" r="1.9"></circle>
              <circle cx="16.7" cy="7.4" r="2.05"></circle>
              <circle cx="18.1" cy="12.2" r="1.8"></circle>
              <path d="M12.1 19.7c-1.2 0-2.1-.44-2.86-1.06-.54-.43-.97-.7-1.63-.7-1.46 0-2.63-1.14-2.63-2.7 0-2.9 2.5-5.62 5.54-5.62 3.85 0 7.12 3.08 7.12 6.2 0 2.22-1.64 3.9-3.88 3.9-.84 0-1.38-.24-1.97-.62-.23-.15-.44-.25-.69-.25Z"></path>
            </svg>
            <span>Khách hàng - minhnguyen@gmail.com</span>
          </button>
        </div>
      </div>

      <div class="my-9 flex items-center gap-4 text-sm font-medium text-slate-400">
        <span class="h-px flex-1 bg-slate-200"></span>
        <span>Hoặc đăng nhập thủ công</span>
        <span class="h-px flex-1 bg-slate-200"></span>
      </div>

      <form id="login-form" class="space-y-5">
        <label class="block">
          <span class="text-base font-semibold text-slate-800">Email</span>
          <span class="auth-input mt-3">
            <svg class="h-5 w-5 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M4 6.5h16v11H4z"></path>
              <path d="m4.8 7.2 7.2 5.4 7.2-5.4"></path>
            </svg>
            <input id="admin-email" type="email" value="minhnguyen@gmail.com" placeholder="email@example.com" class="w-full bg-transparent text-base text-slate-900 outline-none placeholder:text-slate-400">
          </span>
        </label>

        <label class="block">
          <span class="text-base font-semibold text-slate-800">Mật khẩu</span>
          <span class="auth-input mt-3">
            <svg class="h-5 w-5 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="5" y="10" width="14" height="10" rx="2"></rect>
              <path d="M8 10V7.5a4 4 0 0 1 8 0V10"></path>
            </svg>
            <input id="admin-password" type="password" value="customer123" placeholder="Nhập mật khẩu" class="w-full bg-transparent text-base text-slate-900 outline-none placeholder:text-slate-400">
            <button id="toggle-password" type="button" class="rounded-full p-1 text-slate-400 transition hover:bg-slate-100 hover:text-sky-600" aria-label="Hiện mật khẩu">
              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M2.5 12s3.3-6 9.5-6 9.5 6 9.5 6-3.3 6-9.5 6-9.5-6-9.5-6Z"></path>
                <circle cx="12" cy="12" r="2.6"></circle>
              </svg>
            </button>
          </span>
        </label>

        <p id="login-error" class="hidden text-sm font-medium text-rose-600">Thông tin đăng nhập chưa đúng. Vui lòng thử lại.</p>

        <button type="submit" class="auth-submit">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
            <path d="M14 5l7 7-7 7"></path>
            <path d="M21 12H9"></path>
            <path d="M5 5v14"></path>
          </svg>
          <span>Đăng nhập</span>
        </button>
      </form>

      <div class="mt-8 text-center">
        <p class="text-base text-slate-500">
          Chưa có tài khoản?
          <a href="dang-ky.html" class="font-bold text-sky-600 transition hover:text-sky-700">Đăng ký miễn phí →</a>
        </p>
        <a href="../index.html" class="mt-6 inline-flex text-sm font-medium text-slate-400 transition hover:text-sky-600">Quay lại Trang chủ</a>
      </div>
    </section>
  </main>

  <script src="../assets/js/login.js"></script>
</body>
</html>
